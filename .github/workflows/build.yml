name: Build wlan-sec-test-tool
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_win.txt
          pip install pyinstaller

      # 打包GUI：移除 -F，不打包成单文件
      - name: Build GUI program
        run: |
          pyinstaller -w `
            --add-data "wlan_sec_test_tool_gui.ui;." `
            --noconsole `
            -n wlan-sec-test-tool-GUI `
            wlan_sec_test_tool_gui.py

      - name: Build CLI program
        run: |
          pyinstaller -F `
            -n wlan-sec-test-tool-CLI `
            wlan_sec_test_tool_cli.py

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-output
          path: dist/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system lib & python deps
        run: |
          sudo apt update
          sudo apt install -y libxcb-cursor0
          python -m pip install --upgrade pip
          pip install -r requirements_linux.txt
          pip install pyinstaller

      - name: Build GUI
        run: |
          pyinstaller -w \
            --add-data "wlan_sec_test_tool_gui.ui:." \
            --noconsole \
            -n wlan-sec-test-tool-GUI \
            wlan_sec_test_tool_gui.py
      - name: Build CLI
        run: |
          pyinstaller -F \
            -n wlan-sec-test-tool-CLI \
            wlan_sec_test_tool_cli.py

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-build-output
          path: dist/
